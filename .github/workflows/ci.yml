name: validate

# Validate the bundle on every push and pull request: manifest and documentation
# checks, packed contents, and a compatibility run against the engines.dsh floor.
# This bundle has no build step, so CI is packaging discipline plus install wiring.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: bundle checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate bundle
        run: pnpm run check

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Inspect tarball
        run: |
          TGZ="$(ls dist/dsh-paper-mode-*.tgz)"
          test -n "$TGZ"
          tar -tzf "$TGZ" | sort
          for required in \
            package.json \
            cordis.patch.yml \
            locale/en.json \
            locale/zh.json \
            docs/DETAIL.en.md \
            docs/DETAIL.zh.md \
            docs/DEPENDENCIES.md \
            skills/latex-paper/SKILL.md \
            skills/latex-paper/scripts/latex-build.sh; do
            tar -tzf "$TGZ" | grep -qx "package/$required" || { echo "missing $required in $TGZ"; exit 1; }
          done

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-paper-mode-tarball
          path: dist/*.tgz
          if-no-files-found: error

  dsh-compat:
    name: DSH compatibility (engines floor)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install DSH at the engines floor
        run: |
          FLOOR="$(node -e "const s = require('semver'); process.stdout.write(String(s.minVersion(require('./package.json').engines.dsh).version))")"
          echo "engines floor: $FLOOR"
          npm install --global "@deepseek-ai/dsh@$FLOOR"
          echo "DSH_PACKAGE_DIR=$(npm root -g)/@deepseek-ai/dsh" >> "$GITHUB_ENV"
          dsh --version

      - name: Strict bundle check against installed DSH
        run: pnpm run check --strict

      - name: Install the packed bundle into a throwaway profile
        run: |
          pnpm pack --pack-destination dist
          TGZ="$(pwd)/$(ls dist/dsh-paper-mode-*.tgz)"
          export DSH_HOME="$(mktemp -d)"
          dsh plugin --profile citest add "$TGZ"
          dsh --profile citest --dump-config > /tmp/composed.yml
          grep -q 'preset-paper' /tmp/composed.yml
          grep -q 'dsh-paper-mode' /tmp/composed.yml

      - name: Show the composed layer
        run: grep -n -A4 'dsh-paper-mode' /tmp/composed.yml | head -20
